kind = "web"
previewPath = "/"
title = "Enterprise Ticketing & Project Management"
version = "1.0.0"
id = "artifacts/enterprise-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18961

[services.development]
run = "pnpm --filter @workspace/enterprise-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/enterprise-app", "run", "build" ]
publicDir = "artifacts/enterprise-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18961"
BASE_PATH = "/"
